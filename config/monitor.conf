# =============================================================================
#  SombraViva — limites do monitoramento (usado por 03_monitor.sh)
#  Instalado em /etc/sombraviva/monitor.conf pelo 04_setup_monitoring.sh.
#  Altere aqui e rode: sudo systemctl restart sombraviva-monitor
# =============================================================================

# Intervalo entre verificações no modo contínuo (segundos)
INTERVALO=30

# Limites em % (WARN = atenção, CRIT = crítico)
CPU_WARN=75
CPU_CRIT=90
MEM_WARN=80
MEM_CRIT=92
DISCO_WARN=80
DISCO_CRIT=90
# Pontos de montagem verificados
DISCO_PONTOS="/"

# Saúde da aplicação (chama o GET /health da API, que testa o MySQL)
HEALTH_URL="http://127.0.0.1:8000/health"
HEALTH_TIMEOUT=5

# Serviços systemd que devem estar ativos
SERVICOS="sombraviva-api nginx mysql"

# Opcional: URL de webhook (Discord/Slack/Teams) para receber os alertas CRIT
ALERTA_WEBHOOK_URL=""
