# =============================================================================
#  SombraViva — configuração da aplicação (usada por 02_provision_app.sh)
# =============================================================================

# Onde a aplicação é instalada na VM
APP_DIR="/opt/sombraviva"
USUARIO_APP="sombraviva"

# Origem do código da API (backend desenvolvido na disciplina de SOA):
#   "git"   = clona APP_GIT_URL (padrão)
#   "local" = usa uma pasta já existente, indicada em APP_FONTE
APP_ORIGEM="git"
APP_GIT_URL="https://github.com/doug-melo/sombraviva-soa.git"
# APP_FONTE="/home/douglas/sombraviva-soa"
APP_GIT_BRANCH="main"
# Módulo ASGI que o Uvicorn sobe (troque se o backend de SOA tiver outro caminho)
APP_MODULO="app.main:app"

# Servidor
API_HOST="0.0.0.0"
API_PORTA="8000"
UVICORN_WORKERS="1"

# Banco de dados MySQL
DB_NAME="sombraviva"
DB_USER="sombraviva"
DB_HOST="127.0.0.1"
DB_PORT="3306"
# Vazio = gera uma senha aleatória forte na primeira execução e REUTILIZA
# a mesma nas próximas (fica salva em /etc/sombraviva/sombraviva.env, chmod 600).
DB_PASSWORD=""

# Tokens dos dispositivos IoT (formato device_id:token, separados por vírgula).
# Deve bater com DEVICE_ID / DEVICE_TOKEN do sketch.ino no Wokwi.
# Use valores FICTÍCIOS — nunca versione tokens reais.
SOMBRAVIVA_DEVICE_TOKENS="esp32-osasco-calcadao-01:sv-dev-TROQUE-ESTE-TOKEN"

# Administrador do painel /admin (Cybersecurity).
# Senha vazia = gerada na primeira execução e salva em /etc/sombraviva/sombraviva.env
# Para ver: sudo grep ADMIN_PASSWORD /etc/sombraviva/sombraviva.env
ADMIN_EMAIL="admin@sombraviva.local"
ADMIN_PASSWORD=""
OPENAI_MODEL="gpt-4.1-mini"

# Nginx
NGINX_SERVER_NAME="sombraviva.local sombraviva-srv sombraviva-srv.local _"
