# =============================================================================
#  SombraViva — configuração de infraestrutura (usada por 01_provision_infra.sh)
#  Formato: VARIAVEL="valor"  (é carregado com 'source' pelo Bash)
# =============================================================================

# ---- Identificação do servidor ---------------------------------------------
HOSTNAME_SRV="sombraviva-srv"
DOMINIO_LOCAL="sombraviva.local"        # nome local da aplicação (resolve via /etc/hosts)
TIMEZONE="America/Sao_Paulo"

# ---- DNS (systemd-resolved) -------------------------------------------------
DNS_SERVIDORES="1.1.1.1 8.8.8.8"         # resolvers principais
DNS_FALLBACK="9.9.9.9 8.8.4.4"           # usados se os principais falharem

# ---- IP -------------------------------------------------------------------------
# Padrão SEGURO: manter DHCP (funciona em NAT e Bridge do VirtualBox).
# Para IP fixo mude USAR_IP_ESTATICO para "true" e ajuste os valores abaixo
# de acordo com a SUA rede (atenção: IP errado derruba a conexão SSH!).
USAR_IP_ESTATICO="false"
INTERFACE=""                             # vazio = detecta a interface da rota padrão
IP_ESTATICO="192.168.0.50/24"
GATEWAY="192.168.0.1"

# ---- mDNS (avahi): permite acessar http://sombraviva-srv.local da sua máquina
# real quando a VM está em modo Bridge. "false" para não instalar.
INSTALAR_AVAHI="true"

# ---- Firewall (ufw) ---------------------------------------------------------
# 22 = SSH (com limite contra força bruta), 80 = Nginx, 8000 = API direta (Uvicorn)
PORTAS_LIBERADAS="80/tcp 8000/tcp"
PORTA_SSH="22/tcp"

# ---- Usuário de serviço ------------------------------------------------------
USUARIO_APP="sombraviva"
APP_DIR="/opt/sombraviva"
