# =============================================================================
#  SombraViva — Nginx como proxy reverso (porta 80 -> Uvicorn 127.0.0.1:@API_PORTA@)
#  Instalado em /etc/nginx/sites-available/sombraviva pelo 02_provision_app.sh
# =============================================================================
upstream sombraviva_api {
    server 127.0.0.1:@API_PORTA@;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name @NGINX_SERVER_NAME@;

    access_log /var/log/nginx/sombraviva_access.log;
    error_log  /var/log/nginx/sombraviva_error.log warn;

    # Cabeçalhos básicos de segurança
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://sombraviva_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
